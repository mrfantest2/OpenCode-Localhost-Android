plugins {
    id 'com.android.application'
}

android {
    namespace 'win.fantest.opencodelocalhost'
    compileSdk 35

    defaultConfig {
        applicationId "win.fantest.opencodelocalhost"
        minSdk 28
        targetSdk 35
        versionCode 2
        versionName "0.2.0"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ['**/libopencode_exec.so', '**/libopencode-crhandler.so']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
